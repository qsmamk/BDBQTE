[Capture]
; Monitor index across all connected adapters and outputs. The first monitor is 0.
monitor=0

[QTE]
; Coordinates are relative to the selected monitor's top-left corner.
center_x=1295
center_y=710
radius=100
ring_thickness=22
center_roi_x=1275
center_roi_y=700
center_roi_width=12
center_roi_height=15

[Vision]
; White pixels tolerate anti-aliasing and small color shifts.
white_threshold=190
white_channel_tolerance=65
red_threshold=145
red_ratio=1.55
angle_steps=720
radial_samples=13
normal_density_threshold=0.12
normal_density_delta=0.08
perfect_density_threshold=0.62
perfect_density_delta=0.35
min_zone_angle_deg=2.0
max_zone_angle_deg=110.0
reference_pixel_tolerance=52
qte_match_threshold=82.0
white_loss_threshold=4
red_pixels_threshold=2

[Debug]
show_window=true
save_frames=false
verbose=false
log_level=1
plot_overlay=true

[Test]
test_mode=false
test_frames_dir=test_frames
frame_interval_ms=0
loop=false
